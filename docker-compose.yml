version: "3.8"

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

backend:
  build: ./backend
  ports:
    - "5000:5000"
  depends_on:
    - mongo
  env_file:
    - .env
  volumes:
    - ./backend:/app


  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
